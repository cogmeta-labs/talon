name: Feature Request
description: Suggest a feature or improvement for Talon
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature requests — many of Talon's capabilities originated from user feedback.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this feature solve? What workflow would it improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've tried
  - type: input
    id: version
    attributes:
      label: Talon version
      description: "Run `cogz --version` to find this"
      placeholder: "0.7.3"
